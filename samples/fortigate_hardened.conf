#config-version=FG100F-7.4.4-FW-build2662-240514:opmode=0:vdom=0:user=netadmin
#conf_file_ver=0000000000000000
#buildno=2662
#global_vdom=1
# FAKE SAMPLE CONFIG FOR TESTING CONFIGSENTRY - NOT FROM A REAL DEVICE
config system global
    set admin-maintainer disable
    set admintimeout 10
    set alias "FG100F"
    set hostname "LAB-FGT-02"
    set pre-login-banner enable
    set timezone 72
end
config system auto-install
    set auto-install-config disable
    set auto-install-image disable
end
config system password-policy
    set status enable
    set minimum-length 12
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.18 255.255.255.248
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "mgmt"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
end
config system admin
    edit "netadmin"
        set accprofile "super_admin"
        set vdom "root"
        set trusthost1 192.0.2.0 255.255.255.0
        set password ENC SH2FAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE
    next
end
config log syslogd setting
    set status enable
    set server "192.0.2.50"
end
config firewall policy
    edit 1
        set name "LAN-to-Internet-Web"
        set srcintf "mgmt"
        set dstintf "wan1"
        set action accept
        set srcaddr "LAN-USERS"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set logtraffic all
        set nat enable
    next
end
