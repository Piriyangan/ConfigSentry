# FAKE SAMPLE CONFIG FOR TESTING CONFIGSENTRY - NOT FROM A REAL DEVICE
config system global
    set admintimeout 480
    set admin-lockout-threshold 10
    set alias "FG100F"
    set hostname "LAB-FGT-01"
    set strong-crypto disable
    set admin-https-ssl-versions tlsv1-1 tlsv1-2 tlsv1-3
    set timezone 72
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping https ssh http
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh telnet
        set type hard-switch
        set role lan
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2FAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config vpn certificate local
    edit "LAB-CERT"
        set password ENC FAKEFAKE
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
FAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE
-----END ENCRYPTED PRIVATE KEY-----"
        set certificate "-----BEGIN CERTIFICATE-----
FAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE
-----END CERTIFICATE-----"
    next
end
config firewall policy
    edit 1
        set name "LAN-to-Internet"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "Web-Server-Inbound"
        set srcintf "wan1"
        set dstintf "internal"
        set action accept
        set srcaddr "all"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
